name: Validate Story Submission

on:
  pull_request:
    paths:
      - 'app/stories/**'
      - 'public/images/stories/**'
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-story:
    name: Validate Story Structure and Content
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed story files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            app/stories/**/page.mdx

      - name: Validate story structure
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Validating story files..."
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Checking: $file"
            
            # Extract story folder path
            STORY_DIR=$(dirname "$file")
            STORY_NAME=$(basename "$STORY_DIR")
            
            echo "Story folder: $STORY_NAME"
            
            # Check if story folder follows naming convention (##-slug-format)
            if ! echo "$STORY_NAME" | grep -qE '^[0-9]{2}-[a-z0-9-]+$'; then
              echo "❌ ERROR: Story folder '$STORY_NAME' must follow format: ##-slug-format"
              echo "  Examples: 01-first-date, 25-camping-trip"
              exit 1
            fi
            
            # Check if file is named page.mdx
            if [ "$(basename "$file")" != "page.mdx" ]; then
              echo "❌ ERROR: Story file must be named 'page.mdx', found: $(basename "$file")"
              exit 1
            fi
            
            echo "✅ Story folder structure is valid"
          done

      - name: Check for emojis (NON-NEGOTIABLE)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking for emojis in story content..."
          EMOJI_FOUND=0
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Scanning: $file"
            
            # Check for common emoji unicode ranges
            # This checks for: emoticons, symbols, flags, etc.
            if grep -qP '[\x{1F300}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]' "$file"; then
              echo "❌ ERROR: Emojis found in $file"
              echo "Constitution Principle IV: NO EMOJIS (NON-NEGOTIABLE)"
              echo "Please use descriptive text instead."
              EMOJI_FOUND=1
            fi
            
            # Check for ASCII emoticons :) :( etc.
            if grep -qE '[:;]-?[\)\(DPpO]|[\)\(DPpO]-?[:;]' "$file"; then
              echo "⚠️  WARNING: ASCII emoticons found in $file"
              echo "Please use descriptive text instead."
            fi
            
            # Check for emoji shortcodes :smile: :heart: etc.
            if grep -qE ':[a-z_]+:' "$file"; then
              echo "⚠️  WARNING: Emoji shortcodes found in $file"
              echo "If these are emojis (like :smile:), please replace with text."
            fi
          done
          
          if [ $EMOJI_FOUND -eq 1 ]; then
            exit 1
          fi
          
          echo "✅ No emojis detected"

      - name: Validate required imports
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking for required imports..."
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Validating imports in: $file"
            
            # Check for StoryImage import
            if ! grep -q "import StoryImage from" "$file"; then
              echo "❌ ERROR: Missing import: StoryImage"
              echo "Required: import StoryImage from '../../../components/StoryImage'"
              exit 1
            fi
            
            # Check for HeroImage import
            if ! grep -q "import HeroImage from" "$file"; then
              echo "❌ ERROR: Missing import: HeroImage"
              echo "Required: import HeroImage from '../../../components/HeroImage'"
              exit 1
            fi
            
            # Check for StoryMeta import
            if ! grep -q "import StoryMeta from" "$file"; then
              echo "❌ ERROR: Missing import: StoryMeta"
              echo "Required: import StoryMeta from '../../../components/StoryMeta'"
              exit 1
            fi
            
            echo "✅ All required imports present"
          done

      - name: Validate required components
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking for required components..."
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Validating components in: $file"
            
            # Check for H1 title
            if ! grep -qE '^# ' "$file"; then
              echo "❌ ERROR: Missing H1 title (must start with '# ')"
              exit 1
            fi
            
            # Check for StoryMeta component
            if ! grep -q "<StoryMeta" "$file"; then
              echo "❌ ERROR: Missing <StoryMeta /> component"
              echo "Required: <StoryMeta author=\"Julie\" /> after title"
              exit 1
            fi
            
            # Check for HeroImage component
            if ! grep -q "<HeroImage" "$file"; then
              echo "❌ ERROR: Missing <HeroImage /> component"
              echo "Required: <HeroImage> component with src and alt attributes"
              exit 1
            fi
            
            # Verify StoryMeta has author attribute
            if ! grep -q 'author=' "$file" | grep -q 'StoryMeta'; then
              echo "⚠️  WARNING: StoryMeta should include author attribute"
              echo "Expected: <StoryMeta author=\"Julie\" />"
            fi
            
            echo "✅ All required components present"
          done

      - name: Check for "Ryan" naming convention
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking naming conventions..."
          NAMING_ISSUES=0
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Checking naming in: $file"
            
            # Check for "Daddy" or "Dad" usage (should use "Ryan" instead)
            if grep -qiE '\bDaddy\b|\bDad\b|\bPapa\b' "$file"; then
              echo "⚠️  WARNING: Found 'Daddy', 'Dad', or 'Papa' in $file"
              echo "Constitution Principle IV: Refer to 'Ryan' by name throughout"
              echo "Please review and change to 'Ryan' where appropriate."
              NAMING_ISSUES=1
            fi
            
            # Check if "Ryan" is mentioned at least once
            if ! grep -qi '\bRyan\b' "$file"; then
              echo "⚠️  WARNING: 'Ryan' not found in $file"
              echo "Story should mention 'Ryan' at least once."
              NAMING_ISSUES=1
            fi
          done
          
          if [ $NAMING_ISSUES -eq 1 ]; then
            echo ""
            echo "Please review naming conventions in your story."
            echo "See constitution for details: .specify/memory/constitution.md"
            # Don't fail the build, just warn
          else
            echo "✅ Naming conventions look good"
          fi

      - name: Validate story images
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking for story images..."
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            STORY_DIR=$(dirname "$file")
            STORY_NAME=$(basename "$STORY_DIR")
            
            # Extract slug from folder name (remove number prefix)
            SLUG=$(echo "$STORY_NAME" | sed 's/^[0-9]\{2\}-//')
            
            echo "Checking images for story: $SLUG"
            
            # Check if hero image exists
            HERO_FOUND=0
            if [ -f "public/images/stories/$SLUG/hero.jpg" ]; then
              echo "✅ Found hero.jpg"
              HERO_FOUND=1
            elif [ -f "public/images/stories/$SLUG/hero.webp" ]; then
              echo "✅ Found hero.webp"
              HERO_FOUND=1
            elif [ -f "public/images/stories/$SLUG/hero.png" ]; then
              echo "⚠️  Found hero.png (consider using .jpg or .webp for better performance)"
              HERO_FOUND=1
            fi
            
            if [ $HERO_FOUND -eq 0 ]; then
              echo "❌ ERROR: No hero image found for story '$SLUG'"
              echo "Expected path: public/images/stories/$SLUG/hero.jpg"
              exit 1
            fi
            
            # Check hero image file size (warn if > 500KB)
            for hero in public/images/stories/$SLUG/hero.*; do
              if [ -f "$hero" ]; then
                SIZE=$(stat -f%z "$hero" 2>/dev/null || stat -c%s "$hero" 2>/dev/null || echo "0")
                SIZE_KB=$((SIZE / 1024))
                
                if [ $SIZE_KB -gt 500 ]; then
                  echo "⚠️  WARNING: Hero image is ${SIZE_KB}KB (> 500KB recommended max)"
                  echo "Consider optimizing with: https://squoosh.app/"
                fi
              fi
            done
          done

      - name: Validate MDX syntax
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Validating MDX syntax..."
          npm run build
          echo "✅ MDX syntax is valid (build succeeded)"

      - name: Run constitution compliance report
        if: always()
        run: |
          echo "==================================="
          echo "📋 Constitution Compliance Summary"
          echo "==================================="
          echo ""
          echo "✅ Story structure validation complete"
          echo "✅ Required imports checked"
          echo "✅ Required components verified"
          echo "✅ Emoji detection complete"
          echo "✅ Naming conventions reviewed"
          echo "✅ Image validation complete"
          echo "✅ MDX syntax validated"
          echo ""
          echo "Next steps:"
          echo "1. Review any warnings or errors above"
          echo "2. Check PR template checklist"
          echo "3. Test story locally: npm run dev"
          echo "4. Request family approval"
          echo ""
          echo "Reference: docs/STORY_REVIEW_WORKFLOW.md"

      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Story Validation Failed
              
              The automated validation checks found some issues with this story submission.
              
              **Please review the workflow output above and address the following:**
              
              - Check for emoji usage (Constitution Principle IV - NON-NEGOTIABLE)
              - Verify all required imports are present
              - Ensure required components are included
              - Follow the correct file structure
              
              **Resources:**
              - [Constitution](./.specify/memory/constitution.md)
              - [Story Review Workflow](./docs/STORY_REVIEW_WORKFLOW.md)
              - [Story Style Guide](./STORY_STYLE_GUIDE.md)
              
              Once you've fixed the issues, push your changes and the workflow will run again automatically.
              
              If you need help, please tag @jemustain or ask in the discussions.`
            })
